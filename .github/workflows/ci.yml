# CI (section 6): runs on every pull request into main or dev, and on every push to dev.
# Part 1 (Day 1): lint, test, manifests. build, scan and e2e-eval are added on Days 2 and 3.
name: ci

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now pointless, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KUSTOMIZE_VERSION: "5.7.1"
  KUBECONFORM_VERSION: "0.7.0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            indexer/requirements*.txt
      - name: Install dependencies
        run: make install PY=python
      - name: ruff and mypy
        run: make lint

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            indexer/requirements*.txt
      - name: Install OCR system packages (Tesseract, poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng poppler-utils
      - name: Install dependencies
        run: make install PY=python
      - name: pytest (stub provider only, no network, no model)
        run: make test

  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned kustomize and kubeconform
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/bin" kustomize
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/bin" kubeconform
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: kubeconform the prod overlay
        run: kustomize build k8s/overlays/prod | kubeconform -strict -summary
      - name: kubeconform the dev overlay
        run: kustomize build k8s/overlays/dev | kubeconform -strict -summary
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML for the parity check
        run: python -m pip install pyyaml==6.0.2
      - name: Job indexer and CronJob reindex run the same pod (AMB-14)
        run: |
          python scripts/check_manifests.py k8s/base/indexer-job.yaml k8s/base/reindex-cronjob.yaml
          kustomize build k8s/overlays/prod | python scripts/check_manifests.py -
          kustomize build k8s/overlays/dev | python scripts/check_manifests.py -
