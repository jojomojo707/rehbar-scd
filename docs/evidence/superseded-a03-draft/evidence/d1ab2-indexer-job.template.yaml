apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: rahbar
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/part-of: rahbar
    assignment: a03-d1ab2
    assignment-run: __RUN_ID__
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indexer
        app.kubernetes.io/part-of: rahbar
        assignment: a03-d1ab2
        assignment-run: __RUN_ID__
    spec:
      restartPolicy: Never
      serviceAccountName: rahbar-indexer
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: indexer
          image: rahbar-indexer:d1ab2
          imagePullPolicy: Never
          args: __ARGS__
          envFrom:
            - configMapRef:
                name: rahbar-config
          env:
            - name: CHROMA_COLLECTION
              value: __COLLECTION__
            - name: KEEP_COLLECTIONS
              value: "10"
            - name: CORPUS_DIR
              value: /batch
            - name: QUARANTINE_DIR
              value: /evidence/d1ab2/quarantine
            - name: VERIFICATION_REPORT_DIR
              value: /evidence/d1ab2/reports
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: batch
              mountPath: /batch
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: evidence
              mountPath: /evidence
      volumes:
        - name: batch
          configMap:
            name: __CONFIGMAP__
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: evidence
          persistentVolumeClaim:
            claimName: corpus
