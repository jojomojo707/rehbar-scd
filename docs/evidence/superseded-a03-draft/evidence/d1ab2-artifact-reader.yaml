apiVersion: v1
kind: Pod
metadata:
  name: d1ab2-artifact-reader
  namespace: rahbar
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/part-of: rahbar
    assignment: a03-d1ab2-artifacts
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: reader
      image: rahbar-indexer:d1ab2
      imagePullPolicy: Never
      command: ["python", "-c", "import time; time.sleep(3600)"]
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: evidence
          mountPath: /evidence
          readOnly: true
  volumes:
    - name: evidence
      persistentVolumeClaim:
        claimName: corpus
