# Services: ClusterIP only (section 4.1). The Ingress is the only way in from outside.
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: rahbar
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  labels:
    app.kubernetes.io/name: ui
    app.kubernetes.io/part-of: rahbar
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
