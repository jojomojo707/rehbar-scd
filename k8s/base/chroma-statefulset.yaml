# StatefulSet chroma: the vector store (section 4.1). A StatefulSet, not a Deployment: a
# stable identity (chroma-0) and its own PVC from volumeClaimTemplates that outlives the pod
# (reason in ARCHITECTURE.md). One replica: only the indexer Job writes, the api only reads.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
  labels:
    app.kubernetes.io/name: chroma
    app.kubernetes.io/part-of: rahbar
spec:
  replicas: 1
  serviceName: chroma
  selector:
    matchLabels:
      app.kubernetes.io/name: chroma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chroma
        app.kubernetes.io/part-of: rahbar
    spec:
      # The Service named chroma would inject CHROMA_PORT=tcp://..., which Chroma reads as its own
      # config and panics on (expected u16). Found on Day 1; fixed by turning service links off.
      enableServiceLinks: false
      serviceAccountName: rahbar-chroma
      automountServiceAccountToken: false
      # Verified on Day 1: chromadb/chroma:1.0.12 runs as uid 1000 with a read-only root
      # filesystem; it writes only to /data (persist_path in the image's /config.yaml) and /tmp.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000          # makes the PVC writable for uid 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chroma
          image: chromadb/chroma:1.0.12   # same version as chromadb-client==1.0.12
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ANONYMIZED_TELEMETRY
              value: "FALSE"
          # Measured peak 159Mi / 93m under query load, 69Mi while the indexer wrote 764 chunks
          # (docs/evidence/kubectl-top-*.txt). The 1Gi limit is kept for blue/green (D2): during a
          # re-index Chroma holds two full index versions, and the corpus may grow.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: 8000
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: 8000
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data             # the PVC is named data-chroma-0
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
