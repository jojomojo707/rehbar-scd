# One host: / to the ui, /api to the api (section 4.1). ingress-nginx from
# `minikube addons enable ingress`. The /api prefix is NOT stripped: the api serves /api/ask.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rahbar
  labels:
    app.kubernetes.io/part-of: rahbar
  annotations:
    # Covers the worst-case request (~41 s: two LLM attempts), validation-and-errors.md.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: rahbar.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 8080
