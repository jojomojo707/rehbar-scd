# rahbar-config: the ONE place both the api and the indexer read their settings from
# (section 4.1). Every key is listed in docs/architecture/interfaces.md § Configuration keys.
# All values are strings. LLM_API_KEY is NOT here: it lives in the Secret rahbar-secret.
#
# Day 2 values (PL14: values proved on the live cluster are committed here the same day):
# the real index and retriever (RETRIEVER=chroma, EMBED_MODEL=BAAI/bge-small-en-v1.5) with the
# chunk configuration measured on 5 Nov (docs/PIPELINE.md): 480 tokens, 64 overlap.
# LLM_PROVIDER stays "stub" until Day 3 switches to Groq.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  labels:
    app.kubernetes.io/part-of: rahbar
data:
  # --- Retrieval and generation (api) ---
  RETRIEVER: "chroma"
  LLM_PROVIDER: "stub"
  LLM_MODEL: "openai/gpt-oss-20b"
  HOSTED_BASE_URL: "https://api.groq.com/openai/v1"
  LLM_TIMEOUT_SECONDS: "20"
  LLM_MAX_TOKENS: "1024"
  LLM_REASONING_EFFORT: "low"
  # 0.2: factual extraction into strict JSON; low variance without fully greedy decoding; it does not fix missing knowledge.
  TEMPERATURE: "0.2"
  TOP_K: "5"
  RELEVANCE_FLOOR: "0.60"
  HYBRID_RETRIEVAL: "false"   # off, as in the chunk-size measurements; Day 3 decides
  SUPERSEDED_FILTER: "true"

  # --- The embedding pin (api AND indexer, section 4.4) ---
  EMBED_MODEL: "BAAI/bge-small-en-v1.5"

  # --- Chroma (api and indexer) ---
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar"
  KEEP_COLLECTIONS: "2"
  CHROMA_WAIT_SECONDS: "180"
  INDEX_REFRESH_SECONDS: "10"

  # --- Redis: semantic cache and turn log (api) ---
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  # Lowest tested value with zero false hits on eval/cache_pairs.yaml (3A3): 0.95 served the
  # wrong answer for "minimum CGPA for an undergraduate degree" vs "... graduate degree" (0.9533).
  # See docs/evidence/cache-threshold.txt.
  CACHE_THRESHOLD: "0.96"
  CACHE_TTL_SECONDS: "86400"
  CACHE_MAX_ENTRIES: "500"
  HISTORY_MAX_TURNS: "3"
  HISTORY_ANSWER_MAX_CHARS: "600"
  TURN_LOG_MAX_ENTRIES: "1000"
  TURN_LOG_TTL_SECONDS: "604800"

  # --- Indexer ---
  CORPUS_DIR: "/corpus"
  CHUNK_SIZE: "480"
  CHUNK_OVERLAP: "64"
  CHUNK_STRATEGY: "structure"
  OCR_ENABLED: "true"
  IMAGE_TAG: "dev"

  # --- Both ---
  LOG_LEVEL: "INFO"
