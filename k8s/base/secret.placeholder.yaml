# The SHAPE of the Secret rahbar-secret, with a placeholder value only (sections 4.1, 4.7).
#
# NEVER put a real key here, and NEVER list this file in kustomization.yaml: applying it
# would overwrite the real Secret. Base64 is encoding, not encryption, so this file has no
# `data:` field. Create the real Secret from the command line instead:
#
#   export LLM_API_KEY=<your Groq key>
#   make secret     # kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
