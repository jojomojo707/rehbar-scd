apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-candidate
  labels:
    app.kubernetes.io/name: api-candidate
    app.kubernetes.io/part-of: rahbar
spec:
  replicas: 1
  progressDeadlineSeconds: 1200
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api-candidate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-candidate
        app.kubernetes.io/part-of: rahbar
    spec:
      enableServiceLinks: false
      serviceAccountName: rahbar-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: rahbar-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: rahbar-config
            - configMapRef:
                name: rahbar-candidate-config
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rahbar-secret
                  key: LLM_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 448Mi
            limits:
              cpu: "1"
              memory: 640Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: pipeline-data
              mountPath: /pipeline-data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: pipeline-data
          persistentVolumeClaim:
            claimName: pipeline-data
---
apiVersion: v1
kind: Service
metadata:
  name: api-candidate
  labels:
    app.kubernetes.io/name: api-candidate
    app.kubernetes.io/part-of: rahbar
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-candidate
  ports:
    - name: http
      port: 8000
      targetPort: 8000
