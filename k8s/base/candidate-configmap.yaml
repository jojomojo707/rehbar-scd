# Part C/F3 candidate: the one pipeline change under test is the chunk size (480 -> 384 tokens).
# It gets its own collection prefix, so the candidate index never touches the live `rahbar-*`
# collections. k8s/candidate-ingest-job.yaml builds it; api-candidate serves it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-candidate-config
  labels:
    app.kubernetes.io/name: api-candidate
    app.kubernetes.io/part-of: rahbar
data:
  CHROMA_COLLECTION: "rahbar-candidate"
  CHUNK_SIZE: "384"
