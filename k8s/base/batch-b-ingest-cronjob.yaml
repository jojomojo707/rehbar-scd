apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch-b-ingest
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/part-of: rahbar
spec:
  # Suspended template: run explicitly for the drift exercise; never replace the active collection.
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: indexer
        app.kubernetes.io/part-of: rahbar
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: indexer
            app.kubernetes.io/part-of: rahbar
        spec:
          restartPolicy: Never
          serviceAccountName: rahbar-indexer
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: indexer
              image: rahbar-indexer:dev
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: rahbar-config
              env:
                - name: CORPUS_DIR
                  value: /batch-b
                - name: CHROMA_COLLECTION
                  value: rahbar-day2-batch-b
              resources:
                requests:
                  cpu: 500m
                  memory: 1500Mi
                limits:
                  cpu: "2"
                  memory: 3Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: batch-b
                  mountPath: /batch-b
                  readOnly: true
                - name: pipeline-data
                  mountPath: /pipeline-data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: batch-b
              configMap:
                name: batch-b-clean
            - name: pipeline-data
              persistentVolumeClaim:
                claimName: pipeline-data
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
