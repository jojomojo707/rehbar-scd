# Deployment ui: nginx serving the given chat page (section 4.1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  labels:
    app.kubernetes.io/name: ui
    app.kubernetes.io/part-of: rahbar
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui
        app.kubernetes.io/part-of: rahbar
    spec:
      serviceAccountName: rahbar-ui
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: rahbar-ui
          ports:
            - name: http
              containerPort: 8080
          # Measured peak 2Mi / 1m: nginx serving one static file. 32Mi/64Mi leave room for
          # nginx's worker buffers under many concurrent connections.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp           # nginx.conf writes only under /tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
