# One ServiceAccount per workload (section 4.7). None of them calls the Kubernetes API,
# so no token is mounted and no Role or RoleBinding exists.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: rahbar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-ui
  labels:
    app.kubernetes.io/name: ui
    app.kubernetes.io/part-of: rahbar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-chroma
  labels:
    app.kubernetes.io/name: chroma
    app.kubernetes.io/part-of: rahbar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: rahbar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-indexer
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/part-of: rahbar
automountServiceAccountToken: false
