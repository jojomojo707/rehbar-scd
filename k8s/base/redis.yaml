# Redis: the semantic cache and turn log, with persistence (section 4.1).
# Recreate, not RollingUpdate: a ReadWriteOnce PVC cannot be mounted by two pods at once.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: rahbar
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: rahbar
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: rahbar
    spec:
      enableServiceLinks: false   # no REDIS_PORT=tcp://... env var clashing with the ConfigMap
      serviceAccountName: rahbar-redis
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4.12-alpine
          # appendonly: every write is logged to /data, so the cache survives a restart.
          # volatile-lru: under memory pressure, evict keys that have a TTL (all of ours do).
          args: ["redis-server", "--appendonly", "yes", "--dir", "/data",
                 "--maxmemory", "200mb", "--maxmemory-policy", "volatile-lru"]
          ports:
            - name: redis
              containerPort: 6379
          # Measured peak 17Mi / 25m (docs/evidence/kubectl-top-pods.txt). The 256Mi limit is set by
          # --maxmemory 200mb (the cache can grow to 200 MB before volatile-lru evicts) + 28%.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
        - name: tmp
          emptyDir: {}
