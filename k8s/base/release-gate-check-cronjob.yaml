apiVersion: batch/v1
kind: CronJob
metadata:
  name: release-gate-check
  labels:
    app.kubernetes.io/name: rahbar-evaluation
    app.kubernetes.io/part-of: rahbar
spec:
  schedule: "0 5 * * 0"
  timeZone: Asia/Karachi
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: rahbar-evaluation
        app.kubernetes.io/part-of: rahbar
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rahbar-evaluation
            app.kubernetes.io/part-of: rahbar
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: release-gate
              image: rahbar-evaluator:dev
              imagePullPolicy: IfNotPresent
              command: ["python", "/app/eval/release_gate.py"]
              args:
                - --candidate
                - /pipeline-data/eval/results/day2-candidate-api.json
                - --baseline
                - /pipeline-data/eval/baseline.json
                - --faithfulness
                - /app/eval/faithfulness_review_result.json
                - --configmap
                - /gate
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: pipeline-data
                  mountPath: /pipeline-data
                  readOnly: true
                - name: gate
                  mountPath: /gate
                  readOnly: true
          volumes:
            - name: pipeline-data
              persistentVolumeClaim:
                claimName: pipeline-data
            - name: gate
              configMap:
                name: release-gate-thresholds
