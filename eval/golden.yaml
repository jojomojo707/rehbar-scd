    type: abstain
    must_abstain: true
    question: What is the hostel room allocation policy for undergraduate students?
    relevant: []
  - id: A02
    type: abstain
    must_abstain: true
    question: What are the hostel accommodation fees for the current academic year?
    relevant: []
