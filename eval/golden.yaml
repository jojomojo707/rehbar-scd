    type: exact
    question: What exact section number defines the minimum undergraduate CGPA for graduation?
    relevant: [{source: academic-rules-handbook-jun-2026.pdf, section: "1.25"}]
    expect: "1.25"
  - id: E03
    type: exact
    question: What minimum number of students must register for a summer course to be offered?
    relevant: [{source: academic-rules-handbook-jun-2026.pdf, section: "6.11"}]
